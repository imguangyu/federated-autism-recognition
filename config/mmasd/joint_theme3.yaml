# MMASD+ theme3: Yoga (3 actions, global labels 8-10 -> num_class 11)
# Data: data/MMASD+/MMASD+_theme3.npz (labels are global 0..10, one-hot dim 11)
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/MMASD+/MMASD+_theme3.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  normalization: False
  random_rot: True
  p_interval: [0.5, 1]
  vel: False
  bone: False

test_feeder_args:
  data_path: data/MMASD+/MMASD+_theme3.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

model: model.skefreqmixformer.Model
model_args:
  num_class: 11
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'

weight_decay: 0.0005
base_lr: 0.1
step: [35, 55, 75]
warm_up_epoch: 5

device: [0]
batch_size: 32
test_batch_size: 32
num_epoch: 30
nesterov: True
