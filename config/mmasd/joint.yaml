# MMASD+ dataset (11 actions); use after running data/MMASD+/mmasd_to_freqmixformer_npz.py
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/MMASD+/MMASD+_CS.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  normalization: False
  random_rot: True
  p_interval: [0.5, 1]
  vel: False
  bone: False

test_feeder_args:
  data_path: data/MMASD+/MMASD+_CS.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

# model (11 classes, 25 joints, 2 persons - same as NTU)
model: model.skefreqmixformer.Model
model_args:
  num_class: 11
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'

# optim
weight_decay: 0.0005
base_lr: 0.1
step: [35, 55, 75]
warm_up_epoch: 5

# training (smaller batch for smaller dataset)
device: [0]
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
